name: Build .deb packages

on:
  push:
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  client-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev cmake

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client-deb
          cache-on-failure: true

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --target x86_64-unknown-linux-gnu

      - name: Rename artifact
        run: |
          mv target/x86_64-unknown-linux-gnu/debian/pomme-client_*.deb \
             pomme-client-linux-x64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: pomme-client-deb
          path: pomme-client-linux-x64.deb

  launcher-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          shared-key: launcher-deb
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: launcher
        run: pnpm install

      - name: Build launcher
        working-directory: launcher
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - uses: actions/upload-artifact@v7
        with:
          name: pomme-launcher-deb
          path: launcher/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
